[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-worker-bot"
version = "0.3.0"
description = "A local, verifiable task-to-short-video prototype for the AI 临时工 experiment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
render = ["Pillow>=9.0"]

[project.scripts]
ai-worker = "ai_worker_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
