name: JobBridge verify
on:
  push:
    branches: [jobbridge-v0]
    paths:
      - 'projects/jobbridge/payload/**'
      - 'projects/jobbridge/restore.py'
      - '.github/workflows/jobbridge-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobbridge-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore verified source
        run: python3 projects/jobbridge/restore.py
      - name: Build and unit tests
        working-directory: projects/jobbridge/app
        run: |
          python3 scripts/build.py
          node --test tests/core.test.cjs
      - name: Install isolated browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Real local-origin browser checks
        working-directory: projects/jobbridge/app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/jobbridge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/health.json', timeout=1)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise RuntimeError('Local server did not start')
          PY
          python3 tests/real_browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobbridge-technical-preview
          retention-days: 7
          path: |
            projects/jobbridge/app/dist
            projects/jobbridge/app/tests/*results*
            projects/jobbridge/app/tests/*.png
          if-no-files-found: warn
